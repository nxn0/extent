<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Viewport</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">V</span>
        <div>
          <h1>Video Viewport</h1>
          <p id="site-name">Checking this tab…</p>
        </div>
      </header>
      <button id="toggle-mode" class="primary" type="button" disabled>Enter player view</button>
      <section>
        <div>
          <h2>Quick viewer button</h2>
          <p>Allow a button beside videos on this site.</p>
        </div>
        <button id="toggle-site" class="switch" type="button" disabled aria-pressed="false">
          <span class="switch-track" aria-hidden="true"><span></span></span>
          <span id="switch-label">Off</span>
        </button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <script src="src/core.js"></script>
      <script src="popup.js"></script>
    </main>
  </body>
</html>
